<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e7e7e7">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AYATOBOX">
  <title>AYATOBOX - Boxing Timer</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #e7e7e7;
      --card: #f5f3f3;
      --card-border: #e0dede;
      --text: #2a2a2a;
      --text-secondary: #888;
      --text-muted: #bbb;
      --red: #d42b2b;
      --red-deep: #b71c1c;
      --toggle-off: #b0a8a8;
    }

    html, body {
      background: var(--bg);
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      position: relative;
      /* iOSのダブルタップ拡大を無効化（±ボタン連打で画面が拡大するのを防ぐ）。
         ピンチ操作による拡大は従来どおり使える */
      touch-action: manipulation;
    }

    /* 一部のWebKitはbodyの指定だけでは効かないため、操作要素にも個別に指定する */
    button, input, .toggle-switch, .wt-row {
      touch-action: manipulation;
    }

    /* ===== Splash Screen ===== */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .splash-logo {
      display: block;
      width: 380px;
      max-width: 85vw;
      height: auto;
      opacity: 0;
      transform: translateY(-10px);
    }

    .splash-logo.fade-in {
      animation: splash-fadein 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .splash-illust {
      display: block;
      width: 320px;
      max-width: 75vw;
      height: auto;
      opacity: 0;
      transform: translateY(10px);
    }

    .splash-illust.fade-in {
      animation: splash-fadein 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes splash-fadein {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Dissolve: illust fades out while splash bg fades to reveal settings */
    .splash-screen.dissolve .splash-illust {
      animation: dissolve-out 1.2s ease-in-out forwards;
    }

    .splash-screen.dissolve .splash-logo {
      animation: dissolve-out 0.8s ease-in-out forwards;
    }

    .splash-screen.dissolve {
      animation: splash-bg-fade 1.2s ease-in-out 0.3s forwards;
    }

    @keyframes dissolve-out {
      0%   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      50%  { opacity: 0.6; transform: scale(1.02); filter: blur(2px); }
      100% { opacity: 0; transform: scale(1.05); filter: blur(8px); }
    }

    @keyframes splash-bg-fade {
      0%   { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    .splash-screen.hidden {
      display: none;
    }

    /* ===== Top accent bar ===== */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      z-index: 50;
      background: var(--red);
    }

    /* ===== Header ===== */
    .header {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-image {
      display: block;
      width: 420px;
      max-width: 90vw;
      height: auto;
    }

    /* Timer screen logo — round.png参考: 大きめロゴ */
    .header-small .logo-image {
      width: 380px;
      max-width: 80vw;
    }

    .header-small {
      padding: 10px 24px 4px;
    }

    /* ===== Layout ===== */
    .app-layout {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== Settings Screen ===== */
    .settings-screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 8px 0;
    }

    .settings-screen.hidden {
      display: none;
    }

    .settings-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Setting card */
    .setting-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .setting-card-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text);
    }

    .setting-card-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sc-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 22px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .sc-btn:active { transform: scale(0.92); background: #ddd; }

    .sc-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      min-width: 72px;
      text-align: center;
      color: var(--text);
      letter-spacing: 2px;
    }

    /* Toggle card */
    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-radius: 16px;
      padding: 14px 20px;
    }

    .toggle-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-icon {
      width: 24px;
      height: 24px;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    .toggle-card-label {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text);
      transition: color 0.3s ease;
    }

    .toggle-card.active .toggle-card-label {
      color: var(--red);
    }

    .toggle-card.active .toggle-icon {
      color: var(--red);
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 28px;
      cursor: pointer;
    }

    .toggle-switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--toggle-off);
      border-radius: 14px;
      transition: 0.3s;
      pointer-events: none;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--red);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(22px);
    }

    /* Start button */
    .start-area {
      padding: 12px 0 0;
    }

    .btn-start {
      width: 100%;
      height: 68px;
      border: none;
      border-radius: 16px;
      background: var(--red);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-start:active {
      transform: scale(0.97);
      background: var(--red-deep);
    }

    /* ===== Weight Class ===== */
    .btn-weight {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text-secondary);
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-weight:active { transform: scale(0.97); background: #ddd; }
    .btn-weight svg { width: 17px; height: 17px; flex-shrink: 0; }

    .weight-screen {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0 4px;
    }

    .weight-screen.active { display: flex; }

    .weight-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .weight-head-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--text);
    }

    .wc-back {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .wc-back:active { transform: scale(0.92); background: #ddd; }
    .wc-head-spacer { width: 40px; flex-shrink: 0; }

    /* 競技・性別の切替 */
    .wc-modes {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .wc-seg {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    /* 競技区分は3つ、下位区分は2つなので幅を 3:2 で配分する */
    .wc-seg-style { flex: 3; }
    .wc-seg-sub { flex: 2; }

    .wc-seg-btn {
      flex: 1;
      height: 30px;
      padding: 0 2px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .wc-seg-btn.active {
      background: var(--red);
      color: #fff;
    }

    .wc-seg-btn:active { transform: scale(0.96); }

    .weight-input-card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .weight-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* タップして直接入力する欄。入力欄だと分かるよう枠を付ける */
    .weight-input {
      width: 132px;
      height: 48px;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: var(--bg);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
      color: var(--text);
      text-align: center;
      padding: 0 6px;
      -webkit-user-select: text;
      user-select: text;
    }

    .weight-input:focus {
      outline: none;
      color: var(--red);
      border-color: var(--red);
    }


    .weight-unit {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .weight-result {
      background: var(--red);
      border-radius: 16px;
      padding: 16px 20px;
      color: #fff;
      text-align: center;
      flex-shrink: 0;
    }

    .wr-label {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.75;
    }

    .wr-name {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.2;
      margin-top: 3px;
    }

    .wr-en {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-top: 3px;
    }

    .wr-meta {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 12.5px;
      line-height: 1.8;
    }

    .wr-meta b {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .weight-table-wrap {
      position: relative; /* 行の offsetTop の基準にする（無いと body 基準になりスクロール位置がずれる） */
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--card);
      border-radius: 16px;
      padding: 4px 0;
    }

    .wt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 18px;
      font-size: 14px;
      color: var(--text);
    }

    .wt-row + .wt-row { border-top: 1px solid var(--card-border); }

    .wt-row.current {
      background: rgba(212, 43, 43, 0.08);
      color: var(--red);
      font-weight: 700;
    }

    .wt-limit {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .wt-row.current .wt-limit { color: var(--red); }

    .weight-note {
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
      flex-shrink: 0;
    }

    .weight-note a {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    @media (max-height: 740px) {
      .weight-input-card { padding: 10px 16px; }
      .weight-result { padding: 12px 16px; }
      .wr-name { font-size: 23px; }
      .wt-row { padding: 7px 16px; }
      .wc-seg-btn { height: 27px; font-size: 12px; }
      .weight-screen { gap: 8px; }
      .weight-input { height: 44px; font-size: 31px; }
    }

    /* ===== Timer Screen (round.png参考レイアウト) ===== */
    .timer-screen {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0;
    }

    .timer-screen.active {
      display: flex;
    }

    /* Fukidashi telop */
    .fukidashi-area {
      width: 100%;
      height: 84px;
      flex-shrink: 0;
      pointer-events: none;
      position: relative;
      overflow: hidden;
    }

    .fukidashi {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: url('assets/fukidashi.png') no-repeat center top;
      background-size: 100% 100%;
      color: #1a1a1a;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif;
      font-weight: 900;
      font-size: 28px;
      min-width: 280px;
      max-width: 88vw;
      white-space: nowrap;
      text-align: center;
      opacity: 0;
      transition: none;
    }

    .fukidashi span {
      display: block;
      padding: 28px 74px 52px 64px;
    }

    .fukidashi.show {
      animation: fukidashi-in 0.3s cubic-bezier(0.2, 1.2, 0.4, 1) forwards,
                 fukidashi-out 0.35s ease-in 2.0s forwards;
    }

    @keyframes fukidashi-in {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes fukidashi-out {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) translateY(-6px); }
    }

    /* Round info */
    .timer-top-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      line-height: 1;
      margin-bottom: 4px;
    }

    .status-pill {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 6px;
      color: var(--text);
      transition: color 0.4s ease;
    }

    .status-pill.interval {
      color: #4da6ff;
    }

    .round-display {
      line-height: 1;
      text-align: center;
    }

    .round-display-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      color: var(--red);
    }

    .round-display-total {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--text-muted);
    }

    /* Timer ring — timer.png参考: 太めリング + ドロップシャドウ浮遊感 */
    .timer-ring-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin: 12px 0;
    }

    .timer-svg {
      position: absolute;
      inset: 0;
    }

    .ring-bg {
      fill: none;
      stroke: #d8d8d8;
      stroke-width: 18;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 18;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
      transition: stroke-dashoffset 0.4s linear;
    }

    .ring-progress.interval {
      stroke: #4da6ff;
    }

    .timer-digits {
      position: relative;
      z-index: 1;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 48px;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: #444;
      line-height: 1;
    }

    .timer-digits.warning {
      color: var(--red);
      animation: digit-pulse 0.5s ease-in-out infinite;
    }

    @keyframes digit-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Controls */
    .timer-controls {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-shrink: 0;
      margin-top: 10px;
    }

    .ctrl-btn {
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn-main {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      overflow: hidden;
    }

    .ctrl-btn-main img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ctrl-btn-main:active { transform: scale(0.93); }

    .ctrl-btn-side {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      overflow: hidden;
    }

    .ctrl-btn-side img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ctrl-btn-side:active {
      transform: scale(0.93);
    }

    /* ===== Finished Overlay ===== */
    .finished-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .finished-overlay.show { display: flex; }

    .finished-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      letter-spacing: 12px;
      color: #fff;
      line-height: 1;
    }

    .finished-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.6);
    }

    .finished-btn {
      margin-top: 16px;
      padding: 14px 48px;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      border: none;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .finished-btn:active { transform: scale(0.96); }

    /* ===== Footer ===== */
    .footer {
      position: relative;
      z-index: 2;
      padding: 12px;
      flex-shrink: 0;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 3px;
    }

    /* ===== Intro Animations (body.introのみ) ===== */
    body.intro .header .logo-image {
      opacity: 0;

  <script>
    // ===== Voice Manager (m4a file playback, pre-loaded for mobile) =====
    const VoiceManager = (() => {
      // 全音声ファイルを事前ロード（iOS Safari対策）
      const allFiles = [
        'round01.m4a','round02.m4a','round03.m4a','round04.m4a',
        'round05.m4a','round06.m4a','round07.m4a','round08.m4a',
        'round09.m4a','round10.m4a','round11.m4a','round12.m4a',
        'time-1min.m4a','time-half.m4a','time-last1min.m4a','time-last5sec.m4a',
        'interval.m4a','finish.m4a','fight.m4a',
        'cheer-iiyo.m4a','cheer-ikeike.m4a','cheer-sokoda.m4a',
        'cheer-sonochoushi.m4a','cheer-nice.m4a','cheer-madaikeru.m4a',
        'cheer-shuchu.m4a','cheer-shuchushite.m4a',
      ];
      const cache = {};
      allFiles.forEach(f => {
        const a = new Audio('assets/voice/' + f);
        a.preload = 'auto';
        cache[f] = a;
      });

      // HTMLの音声要素を「ユーザー操作中にミュートで一度再生→即停止」して
      // 以降プログラムから自由に再生できるようにする（iOSの自動再生ロック解除）
      // ※ミュートはここでは戻さない。実際に鳴らす瞬間（play/playCheer）で外す。
      //   解除中にミュートを戻すと、その瞬間に音が漏れることがあるため。
      function primeAudio(a) {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
        } else {
          try { a.pause(); a.currentTime = 0; } catch (e) {}
        }
      }

      // iOS Safari: 最初のタップ/クリックで全オーディオを解除
      let unlocked = false;
      function unlockAudio() {
        if (unlocked) return;
        unlocked = true;
        // Web Audioの無音再生でオーディオセッションを有効化
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) {}
        // 全ボイスをプライミング（ミュート再生→即停止）
        allFiles.forEach(f => primeAudio(cache[f]));
        // ゴング・BGMも同じ操作の中で解除しておく
        if (typeof SoundManager !== 'undefined' && SoundManager.prime) SoundManager.prime();
        if (typeof BGMManager !== 'undefined' && BGMManager.prime) BGMManager.prime();
        document.removeEventListener('touchstart', unlockAudio, true);
        document.removeEventListener('click', unlockAudio, true);
      }
      document.addEventListener('touchstart', unlockAudio, true);
      document.addEventListener('click', unlockAudio, true);

      // sound用とcheer用で独立チャンネル
      let currentSound = null;
      let currentCheer = null;

      function play(filename) {
        if (currentSound) {
          currentSound.pause();
          currentSound.currentTime = 0;
        }
        const a = cache[filename];
        if (!a) return;
        a.muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        a.currentTime = 0;
        a.play().catch(() => {});
        currentSound = a;
      }

      function playCheer(filename) {
        if (currentCheer) {
          currentCheer.pause();
          currentCheer.currentTime = 0;
        }
        const a = cache[filename];
        if (!a) return;
        a.muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        a.currentTime = 0;
        a.play().catch(() => {});
        currentCheer = a;
      }

      function stop() {
        if (currentSound) {
          currentSound.pause();
          currentSound.currentTime = 0;
          currentSound = null;
        }
        if (currentCheer) {
          currentCheer.pause();
          currentCheer.currentTime = 0;
          currentCheer = null;
        }
      }

      return { play, playCheer, stop };
    })();

    // ===== Sound Manager =====
    const SoundManager = (() => {
      const startGong = new Audio('assets/gong-start.mp3');
      const endGong = new Audio('assets/gong-end.mp3');
      startGong.preload = 'auto';
      endGong.preload = 'auto';

      let ctx = null;
      function getCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function playAudio(audio) {
        audio.muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // ユーザー操作中にゴングをミュート再生→即停止して解除しておく（ミュートは戻さない）
      function primeEl(a) {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
        } else {
          try { a.pause(); a.currentTime = 0; } catch (e) {}
        }
      }

      return {
        prime() {
          primeEl(startGong);
          primeEl(endGong);
          try { getCtx(); } catch (e) {}  // カウントダウン音のAudioContextも操作中に有効化
        },
        gong() { playAudio(startGong); },
        endGong() { playAudio(endGong); },
        countdown() {
          const c = getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sine';
          osc.frequency.value = 1000;
          g.gain.setValueAtTime(0.15, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.1);
        },
      };
    })();

    // ===== BGM Manager =====
    const BGMManager = (() => {
      const tracks = [
        new Audio('assets/bgm/bgm-01.mp3'),
        new Audio('assets/bgm/bgm-02.mp3'),
      ];
      tracks.forEach(t => { t.preload = 'auto'; });

      let enabled = false;
      let currentIndex = 0;
      let isPlaying = false;

      tracks.forEach((track, i) => {
        track.addEventListener('ended', () => {
          if (!enabled || !isPlaying) return;
          currentIndex = (i + 1) % tracks.length;
          tracks[currentIndex].muted = false;
          tracks[currentIndex].currentTime = 0;
          tracks[currentIndex].play().catch(() => {});
        });
      });

      function play() {
        if (!enabled) return;
        isPlaying = true;
        currentIndex = 0;
        tracks[0].muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        tracks[0].currentTime = 0;
        tracks[0].play().catch(() => {});
      }

      function pause() {
        if (!isPlaying) return;
        tracks[currentIndex].pause();
      }

      function resume() {
        if (!enabled || !isPlaying) return;
        tracks[currentIndex].muted = false;
        tracks[currentIndex].play().catch(() => {});
      }

      function stop() {
        isPlaying = false;
        tracks.forEach(t => { t.pause(); t.currentTime = 0; });
        currentIndex = 0;
      }

      function setEnabled(val) {
        enabled = val;
        if (!val) stop();
      }

      // ユーザー操作中にBGMをミュート再生→即停止して解除しておく（ミュートは戻さない）
      function prime() {
        tracks.forEach(t => {
          t.muted = true;
          const p = t.play();
          if (p && p.then) {
            p.then(() => { t.pause(); t.currentTime = 0; }).catch(() => {});
          } else {
            try { t.pause(); t.currentTime = 0; } catch (e) {}
          }
        });
      }

      return { play, pause, resume, stop, setEnabled, prime, isEnabled: () => enabled };
    })();

    // ===== Fukidashi =====
    const fukidashiBubble = document.getElementById('fukidashiBubble');
    const fukidashiTextEl = document.getElementById('fukidashiText');
    let fukidashiTimer = null;

    function showFukidashi(text) {
      clearTimeout(fukidashiTimer);
      fukidashiBubble.classList.remove('show');
      fukidashiTextEl.textContent = text;
      void fukidashiBubble.offsetWidth;
      fukidashiBubble.classList.add('show');
      fukidashiTimer = setTimeout(() => {
        fukidashiBubble.classList.remove('show');
      }, 2600);
    }

    // ===== App =====
    const app = (() => {
      let roundTime = 180;
      let intervalTime = 60;
      let totalRoundsCount = 3;
      let currentRound = 0;
      let timeRemaining = 0;
      let phase = 'ready';
      let isRunning = false;
      let timerInterval = null;
      let soundEnabled = true;
      let cheerEnabled = false;

      let oneMinuteFired = false;
      let halfTimeFired = false;
      let lastMinuteFired = false;
      let countdownStarted = false;

      const cheerPhrases = [
        { text: 'いいよ！', file: 'cheer-iiyo.m4a' },
        { text: 'イケイケイケイケイケ！', file: 'cheer-ikeike.m4a' },
        { text: 'そこだー！もっと！', file: 'cheer-sokoda.m4a' },
        { text: 'その調子！', file: 'cheer-sonochoushi.m4a' },
        { text: 'ナイスー！', file: 'cheer-nice.m4a' },
        { text: 'まだいける！諦めるな！', file: 'cheer-madaikeru.m4a' },
        { text: '集中！', file: 'cheer-shuchu.m4a' },
        { text: '集中して！', file: 'cheer-shuchushite.m4a' },
      ];
      let nextCheerTime = 0;
      let lastCheerIndex = -1;

      function scheduleNextCheer() {
        nextCheerTime = Math.floor(Math.random() * 13) + 8;
      }

      function doCheer() {
        let idx;
        do {
          idx = Math.floor(Math.random() * cheerPhrases.length);
        } while (idx === lastCheerIndex && cheerPhrases.length > 1);
        lastCheerIndex = idx;
        const phrase = cheerPhrases[idx];
        VoiceManager.playCheer(phrase.file);
        showFukidashi(phrase.text);
        scheduleNextCheer();
      }

      const CIRCUMFERENCE = 2 * Math.PI * 124;

      const settingsScreen = document.getElementById('settingsScreen');
      const timerScreen = document.getElementById('timerScreen');
      const statusPill = document.getElementById('statusPill');
      const roundEl = document.getElementById('currentRound');
      const totalEl = document.getElementById('totalRounds');
      const digitsEl = document.getElementById('timerDigits');
      const progressEl = document.getElementById('ringProgress');
      const btnPause = document.getElementById('btnPause');
      const btnPauseImg = document.getElementById('btnPauseImg');

      function fmt(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return m + ':' + s;
      }

      const headerEl = document.getElementById('header');

      function showSettings() {
        settingsScreen.classList.remove('hidden');
        timerScreen.classList.remove('active');
        headerEl.classList.remove('header-small');
      }

      function showTimer() {
        settingsScreen.classList.add('hidden');
        timerScreen.classList.add('active');
        headerEl.classList.add('header-small');
      }

      function updateSettingsDisplay() {
        document.getElementById('roundTimeDisplay').textContent = fmt(roundTime);
        document.getElementById('intervalTimeDisplay').textContent = fmt(intervalTime);
        document.getElementById('roundsDisplay').textContent = totalRoundsCount;
      }

      function updateTimerDisplay() {
        digitsEl.textContent = fmt(timeRemaining);
        roundEl.textContent = currentRound;
        totalEl.textContent = totalRoundsCount;

        statusPill.textContent = phase === 'round' ? 'ROUND' : phase === 'interval' ? 'REST' : 'READY';
        statusPill.className = 'status-pill' + (phase === 'interval' ? ' interval' : '');

        const total = phase === 'round' ? roundTime : phase === 'interval' ? intervalTime : roundTime;
        const progress = total > 0 ? timeRemaining / total : 0;
        progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
        progressEl.className = 'ring-progress' + (phase === 'interval' ? ' interval' : '');

        if (phase === 'round' && timeRemaining <= 5 && timeRemaining > 0 && isRunning) {
          digitsEl.classList.add('warning');
        } else {
          digitsEl.classList.remove('warning');
        }

        // STOP/GO ボタン画像切り替え
        btnPauseImg.src = isRunning ? 'assets/stopbutton.png' : 'assets/go.png';
        btnPauseImg.alt = isRunning ? 'STOP' : 'GO';
      }

      function resetFlags() {
        oneMinuteFired = false;
        halfTimeFired = false;
        lastMinuteFired = false;
        countdownStarted = false;
        scheduleNextCheer();
      }

      // ラウンドコール用m4aファイル（1〜12）
      const roundVoiceFiles = {
        1: 'round01.m4a',
        2: 'round02.m4a',
        3: 'round03.m4a',
        4: 'round04.m4a',
        5: 'round05.m4a',
        6: 'round06.m4a',
        7: 'round07.m4a',
        8: 'round08.m4a',
        9: 'round09.m4a',
        10: 'round10.m4a',
        11: 'round11.m4a',
        12: 'round12.m4a',
      };

      function announceRound(num) {
        const file = roundVoiceFiles[num];
        if (file) {
          VoiceManager.play(file);
        }
      }

      function tick() {
        if (!isRunning) return;
        timeRemaining--;

        if (phase === 'round') {
          const elapsed = roundTime - timeRemaining;

          if (elapsed === 60 && !oneMinuteFired && roundTime > 90) {
            if (soundEnabled) VoiceManager.play('time-1min.m4a');
            showFukidashi('1分経過');
            oneMinuteFired = true;
          }

          const half = Math.floor(roundTime / 2);
          if (elapsed === half && !halfTimeFired && roundTime >= 60 && half !== 60) {
            if (soundEnabled) VoiceManager.play('time-half.m4a');
            showFukidashi('ハーフタイム');
            halfTimeFired = true;
          }

          if (timeRemaining === 60 && !lastMinuteFired && roundTime > 120 && timeRemaining !== half) {
            if (soundEnabled) VoiceManager.play('time-last1min.m4a');
            showFukidashi('ラスト1分');
            lastMinuteFired = true;
          }

          if (timeRemaining === 5 && !countdownStarted) {
            if (soundEnabled) VoiceManager.play('time-last5sec.m4a');
            showFukidashi('ラスト5秒');
            countdownStarted = true;
          }

          if (soundEnabled && timeRemaining <= 5 && timeRemaining > 0) {
            SoundManager.countdown();
          }

          if (cheerEnabled && timeRemaining > 6) {
            nextCheerTime--;
            if (nextCheerTime <= 0) {
              const justNotified = (elapsed === 60 && roundTime > 90)
                                || (elapsed === half && roundTime >= 60)
                                || (timeRemaining === 60 && roundTime > 120)
                                || (timeRemaining === 5);
              if (!justNotified) {
                doCheer();
              } else {
                scheduleNextCheer();
              }
            }
          }
        }

        if (timeRemaining <= 0) {
          if (phase === 'round') {
            if (soundEnabled) SoundManager.endGong();

            if (currentRound >= totalRoundsCount) {
              phase = 'finished';
              isRunning = false;
              clearInterval(timerInterval);
              timerInterval = null;
              if (soundEnabled) {
                setTimeout(() => VoiceManager.play('finish.m4a'), 1500);
              }
              setTimeout(() => showFukidashi('終了！お疲れ'), 1500);
              BGMManager.stop();
              document.getElementById('finishedOverlay').classList.add('show');
              updateTimerDisplay();
              return;
            }

            phase = 'interval';
            timeRemaining = intervalTime;
            resetFlags();
            if (soundEnabled) {
              setTimeout(() => VoiceManager.play('interval.m4a'), 1000);
            }
            setTimeout(() => showFukidashi('インターバル'), 1000);
          } else if (phase === 'interval') {
            currentRound++;
            phase = 'round';
            timeRemaining = roundTime;
            resetFlags();
            if (soundEnabled) {
              SoundManager.gong();
              setTimeout(() => announceRound(currentRound), 800);
            }
            setTimeout(() => showFukidashi('ラウンド' + currentRound + 'ファイト'), 800);
          }
        }

        updateTimerDisplay();
      }

      function start() {
        currentRound = 1;
        phase = 'round';
        timeRemaining = roundTime;
        isRunning = true;
        resetFlags();
        showTimer();

        if (soundEnabled) {
          SoundManager.gong();
          setTimeout(() => announceRound(1), 800);
        }
        setTimeout(() => showFukidashi('ラウンド1ファイト'), 800);

        BGMManager.play();
        timerInterval = setInterval(tick, 1000);
        updateTimerDisplay();
      }

      function pause() {
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        BGMManager.pause();
        updateTimerDisplay();
      }

      function resume() {
        isRunning = true;
        BGMManager.resume();
        timerInterval = setInterval(tick, 1000);
        updateTimerDisplay();
      }

      function reset() {
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        BGMManager.stop();
        phase = 'ready';
        currentRound = 0;
        resetFlags();
        VoiceManager.stop();
        showSettings();
      }

      function skip() {
        if (phase === 'round') {
          if (currentRound >= totalRoundsCount) {
            phase = 'finished';
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            timeRemaining = 0;
            BGMManager.stop();
            document.getElementById('finishedOverlay').classList.add('show');
            if (soundEnabled) SoundManager.endGong();
          } else {
            phase = 'interval';
            timeRemaining = intervalTime;
            resetFlags();
            if (soundEnabled) SoundManager.endGong();
          }
        } else if (phase === 'interval') {
          currentRound++;
          phase = 'round';
          timeRemaining = roundTime;
          resetFlags();
          if (soundEnabled) {
            SoundManager.gong();
            setTimeout(() => announceRound(currentRound), 600);
          }
        }
        updateTimerDisplay();
      }

      // Events
      document.getElementById('btnStart').addEventListener('click', start);
      btnPause.addEventListener('click', () => { isRunning ? pause() : resume(); });
      document.getElementById('btnReset').addEventListener('click', reset);
      document.getElementById('btnSkip').addEventListener('click', skip);

      const soundToggleEl = document.getElementById('soundToggle');
      const cheerToggleEl = document.getElementById('cheerToggle');
      const bgmToggleEl = document.getElementById('bgmToggle');

      function updateToggleStyle(inputEl) {
        const card = inputEl.closest('.toggle-card');
        if (inputEl.checked) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      }

      soundToggleEl.addEventListener('change', (e) => {
        soundEnabled = e.target.checked;
        if (!soundEnabled) VoiceManager.stop();
        updateToggleStyle(e.target);
      });

      cheerToggleEl.addEventListener('change', (e) => {
        cheerEnabled = e.target.checked;
        if (cheerEnabled) scheduleNextCheer();
        updateToggleStyle(e.target);
      });

      bgmToggleEl.addEventListener('change', (e) => {
        BGMManager.setEnabled(e.target.checked);
        updateToggleStyle(e.target);
      });

      // 初期状態を反映
      updateToggleStyle(soundToggleEl);
      updateToggleStyle(cheerToggleEl);
      updateToggleStyle(bgmToggleEl);

      document.getElementById('btnFinishedClose').addEventListener('click', () => {
        document.getElementById('finishedOverlay').classList.remove('show');
        reset();
      });

      document.querySelectorAll('.sc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.target;
          const delta = parseInt(btn.dataset.delta);
          if (target === 'roundTime') roundTime = Math.max(30, Math.min(600, roundTime + delta));
          else if (target === 'intervalTime') intervalTime = Math.max(10, Math.min(300, intervalTime + delta));
          else if (target === 'rounds') totalRoundsCount = Math.max(1, Math.min(12, totalRoundsCount + delta));
          updateSettingsDisplay();
        });
      });

      document.addEventListener('keydown', (e) => {
        // 階級ページを開いている間はタイマー操作のショートカットを無効にする
        if (document.getElementById('weightScreen').classList.contains('active')) return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (phase === 'ready') start();
          else if (isRunning) pause();
          else resume();
        } else if (e.code === 'KeyR') {
          reset();
        } else if (e.code === 'ArrowRight') {
          if (phase !== 'ready') skip();
        }
      });

      updateSettingsDisplay();
    })();

    // ===== Weight Class (体重から階級を判定) =====
    (() => {
      // ---- 出典・更新日 ----
      // 階級データは下記の公式情報をそのまま採録している。変更時はDATA_UPDATEDも更新すること。
      const DATA_UPDATED = '2026-10-02';
      const SRC = {

      // ---- 階級データ ----

      const PRO_M = [

      ];
      // 女子はアトム級・ミニフライ級があり、クルーザー級が無い（175ポンド超がヘビー級）
      const PRO_F = [

      ];
      // アマ: [日本語, 英語, kg上限]（最終行は上限なし）。下限は AM_FLOOR
      const AM_M = [
        ['バンタム級', 'BANTAMWEIGHT', 55],

        ['スーパーヘビー級', 'SUPER-HEAVYWEIGHT', null]
      ];
      const AM_F = [
        ['フライ級', 'FLYWEIGHT', 51],
        ['バンタム級', 'BANTAMWEIGHT', 54],

        ['ライトミドル級', 'LIGHT-MIDDLEWEIGHT', 70],
        ['ミドル級', 'MIDDLEWEIGHT', 75]
      ];
      const AM_FLOOR = { m: 50, f: 48 }; // 最軽量階級の下限体重

      // アンダージュニア（男女同じ区分）。各階級の上限kgを並べたもの
      const UJ_E = [31, 34, 37, 40, 43, 46, 49, 52, 56];                     // 小学生の部（下限28kg）
      const UJ_J = [33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 64, 68, 72];     // 中学生の部（下限30kg）
      const UJ_FLOOR = { e: 28, j: 30 };

      function buildSet(rows, kind, sex) {
        return rows.map((r, i) => ({
          jp: r[0],
          en: r[1],
          lb: kind === 'pro' ? r[2] : null,
          kg: kind === 'pro' ? r[3] : r[2],
          // 下限＝ひとつ下の階級の上限。最軽量はアマのみ規定あり
          floor: i > 0
            ? (kind === 'pro' ? rows[i - 1][3] : rows[i - 1][2])
            : (kind === 'am' ? AM_FLOOR[sex] : null)
        }));
      }

      function buildUJ(limits, floor, enLabel) {
        return limits.map((kg, i) => ({
          jp: kg + 'kg級',
          en: enLabel,
          lb: null,
          kg: kg,
          floor: i > 0 ? limits[i - 1] : floor
        }));
      }

      const SETS = {
        pro_m: buildSet(PRO_M, 'pro', 'm'),
        pro_f: buildSet(PRO_F, 'pro', 'f'),
        am_m:  buildSet(AM_M, 'am', 'm'),
        am_f:  buildSet(AM_F, 'am', 'f'),
        uj_e:  buildUJ(UJ_E, UJ_FLOOR.e, 'UJ ELEMENTARY'),
        uj_j:  buildUJ(UJ_J, UJ_FLOOR.j, 'UJ JUNIOR HIGH')
      };

      // 競技区分ごとの下位区分（プロ・アマは男女、ジュニアは学年）
      const SUBS = {
        pro: [['m', '男子'], ['f', '女子']],
        am:  [['m', '男子'], ['f', '女子']],
        uj:  [['e', '小学生'], ['j', '中学生']]
      };

      const STORAGE_KEY = 'ayatobox.weight';
      const MODE_KEY = 'ayatobox.weightMode';
      const MIN_W = 15;
      const MAX_W = 200;

      const settingsScreen = document.getElementById('settingsScreen');
      const weightScreen = document.getElementById('weightScreen');

      const wrEn = document.getElementById('wrEn');
      const wrMeta = document.getElementById('wrMeta');
      const tableEl = document.getElementById('weightTable');
      const noteEl = document.getElementById('weightNote');

      let weight = 60.0;
      let style = 'pro';  // pro | am | uj
      let sub = 'm';      // プロ/アマ: m|f ／ ジュニア: e|j

      const kg = (n) => n.toFixed(2);
      // 60 → "60.0"、53.52 → "53.52" のように余計な桁を出さない
      const fmtW = (n) => {
        const r = Math.round(n * 100) / 100;
        return (Math.round(r * 10) / 10 === r) ? r.toFixed(1) : r.toFixed(2);
      };
      // アマは整数階級なので 55 → "55"、プロは 61.23 のまま
      const fmtLimit = (n) => (n % 1 === 0 ? String(n) : kg(n));

      const currentSet = () => SETS[style + '_' + sub];

      function store(key, val) {
        try { localStorage.setItem(key, val); } catch (e) { /* 保存できなくても動作は続ける */ }
      }

      // 体重を満たせる一番軽い階級＝その人の階級
      function findIndex(w) {
        const set = currentSet();
        const i = set.findIndex((c) => c.kg !== null && w <= c.kg);
        return i === -1 ? set.length - 1 : i;
      }

      function buildTable() {
        const set = currentSet();
        tableEl.innerHTML = '';
        set.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'wt-row';
          row.dataset.index = i;

          const name = document.createElement('span');
          name.textContent = c.jp;

          const limit = document.createElement('span');
          limit.className = 'wt-limit';
          if (style === 'pro') {
            limit.textContent = (c.kg === null) ? '無差別' : kg(c.kg) + ' kg / ' + c.lb + ' lb';
          } else {
            limit.textContent = (c.kg === null)
              ? '+' + fmtLimit(c.floor) + ' kg'
              : fmtLimit(c.floor) + '〜' + fmtLimit(c.kg) + ' kg';
          }

          row.appendChild(name);
          row.appendChild(limit);
          tableEl.appendChild(row);
        });
      }

      function render() {
        const set = currentSet();
        const heaviest = set[set.length - 1];
        // アマ女子の最重量ミドル級には上限があるため、超えると該当階級が無い
        const overTop = heaviest.kg !== null && weight > heaviest.kg;
        const idx = findIndex(weight);
        const cls = set[idx];
        const lower = idx > 0 ? set[idx - 1] : null;

        if (overTop) {
          wrName.textContent = '該当階級なし';
          wrEn.textContent = 'OVER THE TOP CLASS';
          wrMeta.innerHTML =
            '最重量の' + heaviest.jp + '（上限 ' + fmtLimit(heaviest.kg) + ' kg）を<br>' +
            '<b>' + kg(weight - heaviest.kg) + '</b> kg 超えています';
          tableEl.querySelectorAll('.wt-row').forEach((row) => row.classList.remove('current'));
          return;
        }

        wrName.textContent = cls.jp;
        wrEn.textContent = cls.en;

        const lines = [];
        if (cls.kg === null) {
          lines.push(style === 'pro'
            ? 'リミット <b>なし</b>（無差別）'
            : '<b>' + fmtLimit(cls.floor) + '</b> kg 超（上限なし）');
        } else if (style === 'pro') {
          lines.push('リミット <b>' + kg(cls.kg) + '</b> kg ／ ' + cls.lb + ' lb');
        } else {
          lines.push('階級 <b>' + fmtLimit(cls.floor) + '〜' + fmtLimit(cls.kg) + '</b> kg');
        }

        // アマの最軽量階級は下限を下回ると出場できない
        const underFloor = !lower && cls.floor !== null && weight < cls.floor;

        if (cls.kg !== null && !underFloor) {
          const margin = cls.kg - weight;
          lines.push(margin < 0.005
            ? 'ちょうど <b>リミット</b>'
            : 'リミットまで 余裕 <b>' + kg(margin) + '</b> kg');
        }

        if (underFloor) {
          lines.push('下限 ' + fmtLimit(cls.floor) + ' kg まで あと <b>' + kg(cls.floor - weight) + '</b> kg 必要');
        } else if (lower) {
          lines.push(lower.jp + 'なら あと <b>' + kg(weight - lower.kg) + '</b> kg 減量');
        }
        wrMeta.innerHTML = lines.join('<br>');

        tableEl.querySelectorAll('.wt-row').forEach((row) => {
          row.classList.toggle('current', Number(row.dataset.index) === idx);
        });

        // 該当行が隠れていたら見える位置へ
        const currentRow = tableEl.querySelector('.wt-row.current');
        if (currentRow && weightScreen.classList.contains('active')) {
          const wrap = tableEl.parentElement;
          const top = currentRow.offsetTop;
          const bottom = top + currentRow.offsetHeight;
          if (top < wrap.scrollTop || bottom > wrap.scrollTop + wrap.clientHeight) {
            wrap.scrollTop = top - (wrap.clientHeight - currentRow.offsetHeight) / 2;
          }
        }
      }

      function renderNote() {

          'データ更新日 ' + DATA_UPDATED;
      }

      function refresh() {
        buildTable();
        renderNote();
        render();
      }

      const clamp = (w) => Math.min(MAX_W, Math.max(MIN_W, w));

      function setWeight(w, syncInput) {
        weight = Math.round(clamp(w) * 100) / 100;
        if (syncInput) input.value = fmtW(weight);
        store(STORAGE_KEY, String(weight));
        render();
      }

      function buildSubSeg() {
        const seg = document.getElementById('segSub');
        seg.innerHTML = '';
        SUBS[style].forEach(([val, label]) => {
          const b = document.createElement('button');
          b.className = 'wc-seg-btn' + (val === sub ? ' active' : '');
          b.textContent = label;
          b.addEventListener('click', () => setMode(style, val));
          seg.appendChild(b);
        });
      }

      // 区分ごとに最後に選んだ下位区分を覚えておき、戻ってきたときに復元する
      const lastSub = { pro: 'm', am: 'm', uj: 'e' };

      function setMode(nextStyle, nextSub) {
        style = nextStyle;
        const valid = SUBS[style].map((x) => x[0]);
        sub = valid.indexOf(nextSub) === -1 ? lastSub[style] : nextSub;
        lastSub[style] = sub;
        store(MODE_KEY, style + '_' + sub);
        document.querySelectorAll('#segStyle .wc-seg-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.style === style);
        });
        buildSubSeg();
        refresh();
      }

      function openWeight() {
        settingsScreen.classList.add('hidden');
        weightScreen.classList.add('active');
        input.value = fmtW(weight);
        render();
      }

      function closeWeight() {
        weightScreen.classList.remove('active');
        settingsScreen.classList.remove('hidden');
      }

      // 入力中は数値だけ拾う（確定はblur時に整形）
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        if (!isNaN(v) && v >= MIN_W && v <= MAX_W) setWeight(v, false);
      });

      input.addEventListener('blur', () => { setWeight(parseFloat(input.value) || weight, true); });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
      input.addEventListener('focus', () => { input.select(); });

      // iOSの数字キーボードには完了キーが無いため、入力欄以外をタップしたら閉じる
      weightScreen.addEventListener('click', (e) => {
        if (e.target !== input) input.blur();
      });

      document.getElementById('btnWeight').addEventListener('click', openWeight);
      document.getElementById('btnWeightBack').addEventListener('click', closeWeight);

      document.querySelectorAll('#segStyle .wc-seg-btn').forEach((b) => {
        b.addEventListener('click', () => setMode(b.dataset.style, sub));
      });

      // 保存値の復元
      let stored = null, storedMode = null;
      try {
        stored = localStorage.getItem(STORAGE_KEY);
        storedMode = localStorage.getItem(MODE_KEY);
      } catch (e) { /* プライベートブラウズ等 */ }
      if (stored !== null && !isNaN(parseFloat(stored))) weight = clamp(parseFloat(stored));
      if (storedMode && SETS[storedMode]) {
        const parts = storedMode.split('_');
        style = parts[0];
        sub = parts[1];
        lastSub[style] = sub;
      }

      input.value = fmtW(weight);
      setMode(style, sub);
    })();

    // ===== Intro Animation (Splash → Settings) =====
    (() => {
      const splashScreen = document.getElementById('splashScreen');
      const splashLogo = splashScreen.querySelector('.splash-logo');
      const splashIllust = splashScreen.querySelector('.splash-illust');

      const headerLogo = document.querySelector('.header .logo-image');
      const cards = document.querySelectorAll('.settings-cards > *');
      const startArea = document.querySelector('.start-area');

      // Step 1: タイトルロゴ フェードイン (0.3s後)
      setTimeout(() => {
        splashLogo.classList.add('fade-in');
      }, 300);

      // Step 2: illust.png フェードイン (1.0s後)
      setTimeout(() => {
        splashIllust.classList.add('fade-in');
      }, 1000);

      // Step 3: 少し見せてから、ディゾルブ開始 (3.0s後)
      setTimeout(() => {
        splashScreen.classList.add('dissolve');
      }, 3000);

      // Step 4: ディゾルブ中に設定画面のイントロアニメ開始
      const settingsStart = 3400;

      // ヘッダーロゴ フェードイン
      setTimeout(() => {
        headerLogo.classList.add('anim-in');
      }, settingsStart);

      // 設定カード: 上から順にチルトイン
      cards.forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('anim-in');
        }, settingsStart + 300 + i * 100);
      });

      // STARTボタン: 最後にフェードイン
      const startDelay = settingsStart + 300 + cards.length * 100 + 100;
      setTimeout(() => {
        startArea.classList.add('anim-in');
      }, startDelay);

      // Step 5: スプラッシュ完全に非表示 & introクラス削除
      setTimeout(() => {
        splashScreen.classList.add('hidden');
      }, 4500);

      setTimeout(() => {
        document.body.classList.remove('intro');
      }, startDelay + 600);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
