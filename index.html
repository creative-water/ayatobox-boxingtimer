  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z2EZN4XEKM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-Z2EZN4XEKM');

    // 計測が失敗してもアプリの動作は止めない（オフライン利用や解析のブロック時）

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #e7e7e7;
      --card: #f5f3f3;
      --card-border: #e0dede;
      --text: #2a2a2a;
      --text-secondary: #888;
      --text-muted: #bbb;
      --red: #d42b2b;
      --red-deep: #b71c1c;
      --toggle-off: #b0a8a8;
    }

    html, body {
      background: var(--bg);
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      position: relative;
      /* iOSのダブルタップ拡大を無効化（±ボタン連打で画面が拡大するのを防ぐ）。
         ピンチ操作による拡大は従来どおり使える */
      touch-action: manipulation;
    }

    /* 一部のWebKitはbodyの指定だけでは効かないため、操作要素にも個別に指定する */
    button, input, .toggle-switch, .wt-row {
      touch-action: manipulation;
    }

    /* ===== Splash Screen ===== */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .splash-logo {
      display: block;
      width: 380px;
      max-width: 85vw;
      height: auto;
      opacity: 0;
      transform: translateY(-10px);
    }

    .splash-logo.fade-in {
      animation: splash-fadein 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .splash-illust {
      display: block;
      width: 320px;
      max-width: 75vw;
      height: auto;
      opacity: 0;
      transform: translateY(10px);
    }

    .splash-illust.fade-in {
      animation: splash-fadein 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes splash-fadein {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Dissolve: illust fades out while splash bg fades to reveal settings */
    .splash-screen.dissolve .splash-illust {
      animation: dissolve-out 1.2s ease-in-out forwards;
    }

    .splash-screen.dissolve .splash-logo {
      animation: dissolve-out 0.8s ease-in-out forwards;
    }

    .splash-screen.dissolve {
      animation: splash-bg-fade 1.2s ease-in-out 0.3s forwards;
    }

    @keyframes dissolve-out {
      0%   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      50%  { opacity: 0.6; transform: scale(1.02); filter: blur(2px); }
      100% { opacity: 0; transform: scale(1.05); filter: blur(8px); }
    }

    @keyframes splash-bg-fade {
      0%   { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    .splash-screen.hidden {
      display: none;
    }

    /* ===== Top accent bar ===== */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      z-index: 50;
      background: var(--red);
    }

    /* ===== Header ===== */
    .header {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-image {
      display: block;
      width: 420px;
      max-width: 90vw;
      height: auto;
    }

    /* Timer screen logo — round.png参考: 大きめロゴ */
    .header-small .logo-image {
      width: 380px;
      max-width: 80vw;
    }

    .header-small {
      padding: 10px 24px 4px;
    }

    /* ===== Layout ===== */
    .app-layout {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== Settings Screen ===== */
    .settings-screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 8px 0;
    }

    .settings-screen.hidden {
      display: none;
    }

    .settings-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* BGMの曲選択を開くと縦が足りなくなる端末があるので、カード側だけスクロールさせる。
         START と WEIGHT CLASS は下に残したいので .start-area は縮めない。 */
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* 縮めるとカードの中身（特にジャケット）が潰れて切れるので、はみ出させてスクロールさせる */
    .settings-cards > * {
      flex-shrink: 0;
    }

    /* Setting card */
    .setting-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .setting-card-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text);
    }

    .setting-card-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sc-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 22px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .sc-btn:active { transform: scale(0.92); background: #ddd; }

    .sc-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      min-width: 72px;
      text-align: center;
      color: var(--text);
      letter-spacing: 2px;
    }

    /* Toggle card */
    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-radius: 16px;
      padding: 14px 20px;
    }

    .toggle-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-icon {
      width: 24px;
      height: 24px;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    .toggle-card-label {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text);
      transition: color 0.3s ease;
    }

    .toggle-card.active .toggle-card-label {
      color: var(--red);
    }

    .toggle-card.active .toggle-icon {
      color: var(--red);
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 28px;
      cursor: pointer;
    }

    .toggle-switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--toggle-off);
      border-radius: 14px;
      transition: 0.3s;
      pointer-events: none;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--red);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(22px);
    }

    /* BGM track picker ─ BGMをONにしたときだけ開く */
    .bgm-picker {
      background: var(--card);
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 92px));
      justify-content: center;
      gap: 10px;
      padding: 0 20px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.34s ease, opacity 0.24s ease, padding 0.34s ease;
    }

    .bgm-picker.show {
      max-height: 260px;
      opacity: 1;
      padding: 12px 20px 13px;
    }

    .bgm-track {
      position: relative;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: block;
      width: 100%;
      -webkit-touch-callout: none;
      font-family: 'Oswald', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .bgm-track-art {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 0 2px var(--card-border);
      opacity: 0.68;
      transition: box-shadow 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
    }

    .bgm-track:active .bgm-track-art { transform: scale(0.94); }

    .bgm-track[aria-pressed="true"] .bgm-track-art {
      box-shadow: 0 0 0 3px var(--red);
      opacity: 1;
    }

    .bgm-track-title {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      line-height: 1.2;
      /* 「アッパーカット」が入りきらないので折り返す。3列とも同じ高さに揃う */
      overflow-wrap: anywhere;
      transition: color 0.2s ease;
    }

    .bgm-track[aria-pressed="true"] .bgm-track-title { color: var(--red); }

    /* 選択中のジャケットに「もう一度タップで拡大」の目印を出す */
    .bgm-track-zoom {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .bgm-track[aria-pressed="true"] .bgm-track-zoom { display: flex; }
    .bgm-track-zoom svg { width: 12px; height: 12px; color: #fff; }

    /* ジャケットの拡大表示 */
    .jacket-viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .jacket-viewer.show { display: flex; }

    .jacket-viewer-art {
      display: block;
      width: min(86vw, 64vh, 460px);
      height: auto;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      animation: jacketPop 0.26s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    @keyframes jacketPop {
      0%   { opacity: 0; transform: scale(0.88); }
      100% { opacity: 1; transform: scale(1); }
    }

    .jacket-viewer-title {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      text-align: center;
    }

    .jacket-viewer-close {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: none;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 9px 26px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .jacket-viewer-close:active { background: rgba(255, 255, 255, 0.18); }

    /* フッターの「ホーム画面への追加方法」リンク */
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .footer-link {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: inherit;
      letter-spacing: 1px;
      color: var(--red);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer-link:active { opacity: 0.6; }

    /* ホーム画面への追加方法 */
    .install-help {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 160;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .install-help.show { display: flex; }

    .install-card {
      width: 100%;
      max-width: 400px;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      border-radius: 18px;
      padding: 20px;
      animation: jacketPop 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    .install-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .install-title {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text);
    }

    .install-close {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: var(--card);
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .install-close:active { transform: scale(0.92); }

    .install-lead {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .install-seg { margin-bottom: 14px; }

    .install-steps {
      list-style: none;
      counter-reset: step;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .install-steps li {
      counter-increment: step;
      position: relative;
      padding-left: 30px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    .install-steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 1px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .install-steps .ios-share {
      width: 15px;
      height: 15px;
      vertical-align: -3px;
      margin: 0 2px;
      color: #0a84ff;
    }

    /* アプリ内ブラウザなど、先に解決が必要なときの注意書き */
    .install-note {
      background: #fff4f4;
      border: 1px solid #f0d2d2;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
    }

    .install-note-title {
      font-weight: 700;
      color: var(--red-deep);
      margin-bottom: 4px;
    }

    .install-note.done {
      background: #f1f6f1;
      border-color: #d3e3d3;
    }

    .install-note.done .install-note-title { color: #3b7a3b; }

    .install-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .install-btn {
      flex: 1 1 auto;
      min-height: 40px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .install-btn.sub {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .install-btn:active { transform: scale(0.97); }

    @media (min-height: 701px) and (max-height: 860px) {
      .bgm-picker { grid-template-columns: repeat(3, minmax(0, 78px)); }
      .bgm-picker.show { padding: 10px 20px 11px; gap: 8px; }
      .bgm-track-title { margin-top: 5px; font-size: 9px; }
    }

    /* Start button */
    .start-area {
      padding: 12px 0 0;
      flex-shrink: 0;   /* カード側がスクロールしても START は常に見せる */
    }

    .btn-start {
      width: 100%;
      height: 68px;
      border: none;
      border-radius: 16px;
      background: var(--red);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-start:active {
      transform: scale(0.97);
      background: var(--red-deep);
    }

    /* ===== Weight Class ===== */
    /* 「軽量タイム」ボタン。デザイン画像をそのまま使うので枠や背景は持たせない */
    /* 「軽量タイム」ボタン。デザイン画像をそのまま使うので枠や背景は持たせない。
       当たり判定が画像からはみ出さないよう、ボタン自体を画像幅に合わせる。 */
    .btn-weight {
      display: block;
      width: 100%;
      max-width: 240px;
      margin: 8px auto 0;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-weight img {
      display: block;
      width: 100%;
      height: auto;
    }

    .btn-weight:active { transform: scale(0.95); opacity: 0.85; }

    .weight-screen {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0 4px;
    }

    .weight-screen.active { display: flex; }

    .weight-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .weight-head-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--text);
    }

    .wc-back {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .wc-back:active { transform: scale(0.92); background: #ddd; }
    .wc-head-spacer { width: 40px; flex-shrink: 0; }

    /* 競技・性別の切替 */
    .wc-modes {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .wc-seg {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    /* 幅はボタン数に比例させる（下位区分の数はJSで style.flex に設定） */
    .wc-seg-style { flex: 4; }
    .wc-seg-sub { flex: 2; }

    .wc-seg-btn {
      flex: 1;
      height: 30px;
      padding: 0 2px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .wc-seg-btn.active {
      background: var(--red);
      color: #fff;
    }

    .wc-seg-btn:active { transform: scale(0.96); }

    .weight-input-card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .weight-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* タップして直接入力する欄。入力欄だと分かるよう枠を付ける */
    .weight-input {
      width: 132px;
      height: 48px;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: var(--bg);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
      color: var(--text);
      text-align: center;
      padding: 0 6px;
      -webkit-user-select: text;
      user-select: text;
    }

    .weight-input:focus {
      outline: none;
      color: var(--red);
      border-color: var(--red);
    }


    .weight-unit {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .weight-result {
      background: var(--red);
      border-radius: 16px;
      padding: 16px 20px;
      color: #fff;
      text-align: center;
      flex-shrink: 0;
    }

    .wr-label {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.75;
    }

    .wr-name {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.2;
      margin-top: 3px;
    }

    .wr-en {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-top: 3px;
    }

    .wr-meta {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 12.5px;
      line-height: 1.8;
    }

    .wr-meta b {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .weight-table-wrap {
      position: relative; /* 行の offsetTop の基準にする（無いと body 基準になりスクロール位置がずれる） */
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--card);
      border-radius: 16px;
      padding: 4px 0;
    }

    .wt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 18px;
      font-size: 14px;
      color: var(--text);
    }

    .wt-row + .wt-row { border-top: 1px solid var(--card-border); }

    .wt-row.current {
      background: rgba(212, 43, 43, 0.08);
      color: var(--red);
      font-weight: 700;
    }

    .wt-limit {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .wt-row.current .wt-limit { color: var(--red); }

    .weight-note {
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
      flex-shrink: 0;
    }

    .weight-note a {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    @media (max-height: 740px) {
      .weight-input-card { padding: 10px 16px; }
      .weight-result { padding: 12px 16px; }
      .wr-name { font-size: 23px; }
      .wt-row { padding: 7px 16px; }
      .wc-seg-btn { height: 27px; font-size: 12px; }
      .weight-screen { gap: 8px; }
      .weight-input { height: 44px; font-size: 31px; }
    }

    /* ===== Timer Screen (round.png参考レイアウト) ===== */
    .timer-screen {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0;
    }

    .timer-screen.active {
      display: flex;
    }

    /* Fukidashi telop */
    .fukidashi-area {
      width: 100%;
      height: 84px;
      flex-shrink: 0;
      pointer-events: none;
      position: relative;
      overflow: hidden;
    }

    .fukidashi {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: url('assets/fukidashi.png') no-repeat center top;
      background-size: 100% 100%;
      color: #1a1a1a;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif;
      font-weight: 900;
      font-size: 28px;
      min-width: 280px;
      max-width: 88vw;
      white-space: nowrap;
      text-align: center;
      opacity: 0;
      transition: none;
    }

    .fukidashi span {
      display: block;
      padding: 28px 74px 52px 64px;
    }

    .fukidashi.show {
      animation: fukidashi-in 0.3s cubic-bezier(0.2, 1.2, 0.4, 1) forwards,
                 fukidashi-out 0.35s ease-in 2.0s forwards;
    }

    @keyframes fukidashi-in {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes fukidashi-out {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) translateY(-6px); }
    }

    /* Round info */
    .timer-top-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      line-height: 1;
      margin-bottom: 4px;
    }

    .status-pill {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 6px;
      color: var(--text);
      transition: color 0.4s ease;
    }

    .status-pill.interval {
      color: #4da6ff;
    }

    .round-display {
      line-height: 1;
      text-align: center;
    }

    .round-display-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      color: var(--red);
    }

    .round-display-total {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--text-muted);
    }

    /* Timer ring — timer.png参考: 太めリング + ドロップシャドウ浮遊感 */
    .timer-ring-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin: 12px 0;
    }

    .timer-svg {
      position: absolute;
      inset: 0;
    }

    .ring-bg {
      fill: none;
      stroke: #d8d8d8;
      stroke-width: 18;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 18;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
      transition: stroke-dashoffset 0.4s linear;
    }

    .ring-progress.interval {
      stroke: #4da6ff;
    }

    .timer-digits {
      position: relative;
      z-index: 1;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 48px;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: #444;
      line-height: 1;
    }

    .timer-digits.warning {
      color: var(--red);
      animation: digit-pulse 0.5s ease-in-out infinite;
    }

    @keyframes digit-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Controls */
    .timer-controls {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-shrink: 0;
      margin-top: 10px;
    }

    .ctrl-btn {
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn-main {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      overflow: hidden;
    }

    .ctrl-btn-main img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ctrl-btn-main:active { transform: scale(0.93); }

    .ctrl-btn-side {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      overflow: hidden;
    }

    .ctrl-btn-side img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ctrl-btn-side:active {
      transform: scale(0.93);
    }

    /* ===== Finished Overlay ===== */
    .finished-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .finished-overlay.show { display: flex; }

    .finished-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      letter-spacing: 12px;
      color: #fff;
      line-height: 1;
    }

    .finished-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.6);
    }

    .finished-btn {
      margin-top: 16px;
      padding: 14px 48px;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      border: none;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .finished-btn:active { transform: scale(0.96); }

    /* ===== Footer ===== */
    .footer {
      position: relative;
      z-index: 2;
      padding: 12px;
      flex-shrink: 0;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 3px;
    }

    /* ===== Intro Animations (body.introのみ) ===== */
    body.intro .header .logo-image {
      opacity: 0;
      transform: translateY(-10px);
    }

    body.intro .header .logo-image.anim-in {
      animation: logo-fadein 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes logo-fadein {
      0%   { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    body.intro .settings-cards > * {
      opacity: 0;
      transform: perspective(600px) rotateX(-12deg) translateY(20px);
    }

    body.intro .settings-cards > .anim-in {
      animation: card-tilt-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes card-tilt-in {
      0%   { opacity: 0; transform: perspective(600px) rotateX(-12deg) translateY(20px); }
      60%  { opacity: 1; transform: perspective(600px) rotateX(3deg) translateY(-2px); }
      100% { opacity: 1; transform: perspective(600px) rotateX(0deg) translateY(0); }
    }

    body.intro .start-area {
      opacity: 0;
      transform: translateY(16px);
    }

    body.intro .start-area.anim-in {
      animation: start-fadein 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes start-fadein {
      0%   { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== Responsive ===== */

    /* ホーム画面から起動したPWAは、上下のバーの分だけ実際の高さが750px前後になる。
       この帯で設定が収まりきらずBGMの行が切れていたので、各所を少しずつ詰める。
       ※より狭い端末向けの max-height:700px はこの下にあり、そちらが優先される。 */
    @media (max-height: 800px) {
      .header { padding: 14px 24px 8px; }
      .logo-image { width: 310px; }
      .settings-cards { gap: 8px; }
      .setting-card { padding: 12px 20px; }
      .toggle-card { padding: 11px 20px; }
      .start-area { padding: 8px 0 0; }
      .btn-weight { max-width: 220px; }
      .footer { padding: 8px; font-size: 11px; }
      .fukidashi-area { height: 74px; }
      .fukidashi { font-size: 24px; min-width: 250px; max-width: 86vw; }
      .fukidashi span { padding: 24px 52px 46px 42px; }
    }

    @media (max-width: 380px) {
      .logo-image { width: 260px; }
      .setting-card { padding: 12px 16px; }
      .setting-card-title { font-size: 15px; }
      .sc-value { font-size: 28px; min-width: 56px; }
      .sc-btn { width: 34px; height: 34px; }
      .toggle-card { padding: 10px 16px; }
      .bgm-picker.show { padding: 10px 16px 12px; gap: 8px; }
      .bgm-picker { grid-template-columns: repeat(3, minmax(0, 72px)); }
      .bgm-track-title { font-size: 9px; }
      .btn-start { height: 56px; font-size: 22px; }
      .timer-ring-wrap { width: 240px; height: 240px; }
      .timer-digits { font-size: 40px; }
      .round-display-value { font-size: 42px; }
      .round-display-total { font-size: 24px; }
      .fukidashi { font-size: 22px; min-width: 240px; max-width: 85vw; }
      .fukidashi span { padding: 22px 46px 44px 36px; }
      .fukidashi-area { height: 68px; }
    }

    @media (max-height: 700px) {
      .header { padding: 12px 24px 6px; }
      .logo-image { width: 280px; }
      .settings-screen { gap: 6px; }
      .settings-cards { gap: 6px; }
      .setting-card { padding: 10px 16px; }
      .toggle-card { padding: 8px 16px; }
      .btn-weight { max-width: 190px; }
      .bgm-picker.show { padding: 8px 16px 10px; gap: 8px; }
      .bgm-picker { grid-template-columns: repeat(3, minmax(0, 68px)); }
      .bgm-track-title { margin-top: 5px; font-size: 9px; }
      .start-area { padding: 8px 0 0; }
      .btn-start { height: 52px; font-size: 22px; }
      .timer-ring-wrap { width: 240px; height: 240px; margin: 6px 0; }
      .timer-digits { font-size: 40px; }
      .footer { padding: 6px; font-size: 10px; }
      .fukidashi-area { height: 64px; }
      .fukidashi { font-size: 22px; min-width: 240px; max-width: 85vw; }
      .fukidashi span { padding: 20px 46px 42px 36px; }
      .header-small .logo-image { width: 280px; }
      .header-small { padding: 8px 24px 2px; }
      .round-display-value { font-size: 42px; }
      .round-display-total { font-size: 24px; }
      .timer-top-info { margin-bottom: 2px; }
      .timer-controls { margin-top: 4px; }
      .ctrl-btn-main { width: 66px; height: 66px; }
      .ctrl-btn-side { width: 54px; height: 54px; }
    }

    @media (min-height: 800px) {
      .settings-cards { gap: 12px; }
      .timer-ring-wrap { width: 320px; height: 320px; margin: 14px 0; }
      .timer-digits { font-size: 56px; }
      .fukidashi-area { height: 90px; }
      .fukidashi { font-size: 30px; min-width: 320px; max-width: 88vw; }
      .fukidashi span { padding: 30px 66px 54px 56px; }
      .timer-top-info { margin-bottom: 6px; }
      .timer-controls { margin-top: 14px; }
      .round-display-value { font-size: 60px; }
      .round-display-total { font-size: 34px; }
      .ctrl-btn-main { width: 84px; height: 84px; }
      .ctrl-btn-side { width: 68px; height: 68px; }
    }

    @media (min-height: 900px) {
      .header { padding: 28px 24px 16px; }
      .timer-ring-wrap { width: 340px; height: 340px; margin: 18px 0; }
      .timer-digits { font-size: 62px; }
      .logo-image { width: 400px; }
      .header-small .logo-image { width: 360px; }
      .round-display-value { font-size: 66px; }
      .round-display-total { font-size: 36px; }
      .fukidashi { font-size: 32px; min-width: 340px; max-width: 88vw; }
      .fukidashi span { padding: 32px 70px 62px 60px; }
      .fukidashi-area { height: 100px; }
      .timer-top-info { margin-bottom: 8px; }
      .timer-controls { margin-top: 18px; }
      .ctrl-btn-main { width: 88px; height: 88px; }
      .ctrl-btn-side { width: 72px; height: 72px; }
    }
  </style>
</head>
<body class="intro">

  <!-- ===== SPLASH SCREEN ===== -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-content">
      <img src="assets/logo.png" alt="AYATOBOX" class="splash-logo">
      <img src="assets/illust.png" alt="" class="splash-illust">
    </div>
  </div>

  <div class="top-bar"></div>

  <header class="header" id="header">
    <img src="assets/logo.png" alt="AYATOBOX" class="logo-image">
  </header>

  <div class="app-layout">

    <!-- ===== SETTINGS SCREEN ===== -->
    <div class="settings-screen" id="settingsScreen">
      <div class="settings-cards">

        <div class="setting-card">
          <div class="setting-card-title">ROUND TIME</div>
          <div class="setting-card-control">
            <button class="sc-btn" data-target="roundTime" data-delta="-30">&minus;</button>
            <span class="sc-value" id="roundTimeDisplay">3:00</span>
            <button class="sc-btn" data-target="roundTime" data-delta="30">+</button>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-card-title">INTERVAL</div>
          <div class="setting-card-control">
            <button class="sc-btn" data-target="intervalTime" data-delta="-10">&minus;</button>
            <span class="sc-value" id="intervalTimeDisplay">1:00</span>
            <button class="sc-btn" data-target="intervalTime" data-delta="10">+</button>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-card-title">ROUNDS</div>
          <div class="setting-card-control">
            <button class="sc-btn" data-target="rounds" data-delta="-1">&minus;</button>
            <span class="sc-value" id="roundsDisplay">3</span>
            <button class="sc-btn" data-target="rounds" data-delta="1">+</button>
          </div>
        </div>

        <div class="toggle-card">
          <div class="toggle-card-left">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span class="toggle-card-label">SOUND</span>
          </div>
          <div class="toggle-switch">
            <input type="checkbox" id="soundToggle" checked>
            <span class="toggle-slider"></span>
          </div>
        </div>

        <div class="toggle-card">
          <div class="toggle-card-left">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <span class="toggle-card-label">CHEER</span>
          </div>
          <div class="toggle-switch">
            <input type="checkbox" id="cheerToggle">
            <span class="toggle-slider"></span>
          </div>
        </div>

        <div class="toggle-card">
          <div class="toggle-card-left">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5.5" cy="17.5" r="2.5"></circle>
              <circle cx="17.5" cy="15.5" r="2.5"></circle>
              <path d="M8 17V5l12-2v12"></path>
            </svg>
            <span class="toggle-card-label">BGM</span>
          </div>
          <div class="toggle-switch">
            <input type="checkbox" id="bgmToggle">
            <span class="toggle-slider"></span>
          </div>
        </div>

        <!-- 曲の選択。中身は BGMManager の曲リストから生成する -->
        <div class="bgm-picker" id="bgmPicker"></div>

      </div>

      <div class="start-area">
        <button class="btn-start" id="btnStart">START</button>
        <button class="btn-weight" id="btnWeight" aria-label="軽量タイム">
          <img src="assets/weightbutton.png" alt="軽量タイム" width="1050" height="362">
        </button>
      </div>

  <!-- ホーム画面への追加方法 -->
  <div class="install-help" id="installHelp" role="dialog" aria-modal="true" aria-label="ホーム画面への追加方法">

  <!-- Finished Overlay -->
  <div class="finished-overlay" id="finishedOverlay">
    <div class="finished-badge">FINISHED</div>
    <div class="finished-sub">GREAT WORK</div>
    <button class="finished-btn" id="btnFinishedClose">OK</button>
  </div>

  <script>
    // ===== Voice Manager (m4a file playback, pre-loaded for mobile) =====
    const VoiceManager = (() => {
      // 全音声ファイルを事前ロード（iOS Safari対策）
      const allFiles = [
        'round01.m4a','round02.m4a','round03.m4a','round04.m4a',
        'round05.m4a','round06.m4a','round07.m4a','round08.m4a',
        'round09.m4a','round10.m4a','round11.m4a','round12.m4a',
        'time-1min.m4a','time-half.m4a','time-last1min.m4a','time-last5sec.m4a',
        'interval.m4a','finish.m4a','fight.m4a',
        'cheer-iiyo.m4a','cheer-ikeike.m4a','cheer-sokoda.m4a',
        'cheer-sonochoushi.m4a','cheer-nice.m4a','cheer-madaikeru.m4a',
        'cheer-shuchu.m4a','cheer-shuchushite.m4a',
      ];
      const cache = {};
      allFiles.forEach(f => {
        const a = new Audio('assets/voice/' + f);
        a.preload = 'auto';
        cache[f] = a;
      });

      // HTMLの音声要素を「ユーザー操作中にミュートで一度再生→即停止」して
      // 以降プログラムから自由に再生できるようにする（iOSの自動再生ロック解除）
      // ※ミュートはここでは戻さない。実際に鳴らす瞬間（play/playCheer）で外す。
      //   解除中にミュートを戻すと、その瞬間に音が漏れることがあるため。
      function primeAudio(a) {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
        } else {
          try { a.pause(); a.currentTime = 0; } catch (e) {}
        }
      }

      // iOS Safari: 最初のタップ/クリックで全オーディオを解除
      let unlocked = false;
      function unlockAudio() {
        if (unlocked) return;
        unlocked = true;
        // Web Audioの無音再生でオーディオセッションを有効化
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) {}
        // 全ボイスをプライミング（ミュート再生→即停止）
        allFiles.forEach(f => primeAudio(cache[f]));
        // ゴング・BGMも同じ操作の中で解除しておく
        if (typeof SoundManager !== 'undefined' && SoundManager.prime) SoundManager.prime();
        if (typeof BGMManager !== 'undefined' && BGMManager.prime) BGMManager.prime();
        document.removeEventListener('touchstart', unlockAudio, true);
        document.removeEventListener('click', unlockAudio, true);
      }
      document.addEventListener('touchstart', unlockAudio, true);
      document.addEventListener('click', unlockAudio, true);

      // sound用とcheer用で独立チャンネル
      let currentSound = null;
      let currentCheer = null;

      function play(filename) {
        if (currentSound) {
          currentSound.pause();
          currentSound.currentTime = 0;
        }
        const a = cache[filename];
        if (!a) return;
        a.muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        a.currentTime = 0;
        a.play().catch(() => {});
        currentSound = a;
      }

      function playCheer(filename) {
        if (currentCheer) {
          currentCheer.pause();
          currentCheer.currentTime = 0;
        }
        const a = cache[filename];
        if (!a) return;
        a.muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        a.currentTime = 0;
        a.play().catch(() => {});
        currentCheer = a;
      }

      function stop() {
        if (currentSound) {
          currentSound.pause();
          currentSound.currentTime = 0;
          currentSound = null;
        }
        if (currentCheer) {
          currentCheer.pause();
          currentCheer.currentTime = 0;
          currentCheer = null;
        }
      }

      return { play, playCheer, stop };
    })();

    // ===== Sound Manager =====
    const SoundManager = (() => {
      const startGong = new Audio('assets/gong-start.mp3');
      const endGong = new Audio('assets/gong-end.mp3');
      startGong.preload = 'auto';
      endGong.preload = 'auto';

      let ctx = null;
      function getCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function playAudio(audio) {
        audio.muted = false;  // 解除時にミュートしたままなので、鳴らす瞬間に外す
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // ユーザー操作中にゴングをミュート再生→即停止して解除しておく（ミュートは戻さない）
      function primeEl(a) {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
        } else {
          try { a.pause(); a.currentTime = 0; } catch (e) {}
        }
      }

      return {
        prime() {
          primeEl(startGong);
          primeEl(endGong);
          try { getCtx(); } catch (e) {}  // カウントダウン音のAudioContextも操作中に有効化
        },
        gong() { playAudio(startGong); },
        endGong() { playAudio(endGong); },
        countdown() {
          const c = getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sine';
          osc.frequency.value = 1000;
          g.gain.setValueAtTime(0.15, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.1);
        },
      };
    })();

    // ===== BGM Manager =====
    const BGMManager = (() => {
      // 曲ごとに音量を補正する。アッパーカットは他の2曲より約9dB大きく録れているため、
      // そのままだと曲を変えた瞬間に音量が跳ねる（測定値 RMS: .110 / .126 / .299）。
      const TRACKS = [
        { id: 'bgm-01', title: '8 COUNT',        src: 'assets/bgm/bgm-01.mp3', jacket: 'assets/bgm/jacket-01.jpg', vol: 1.00 },
        { id: 'bgm-02', title: 'UNDEFINED',      src: 'assets/bgm/bgm-02.mp3', jacket: 'assets/bgm/jacket-02.jpg', vol: 0.87 },
        { id: 'bgm-03', title: 'アッパーカット', src: 'assets/bgm/bgm-03.mp3', jacket: 'assets/bgm/jacket-03.jpg', vol: 0.40 },
      ];
      const STORAGE_KEY = 'ayatobox.bgmTrack';

      const tracks = TRACKS.map(t => {
        const a = new Audio(t.src);
        a.preload = 'auto';
        a.loop = true;   // 選んだ曲をそのまま繰り返す（曲送りはしない）
        return a;
      });

      let enabled = false;
      let selectedIndex = 0;   // 設定画面で選んだ曲
      let currentIndex = 0;    // いま鳴っている曲
      let isPlaying = false;

      // 前回選んだ曲を復元する
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const i = TRACKS.findIndex(t => t.id === saved);
        if (i !== -1) selectedIndex = i;
      } catch (e) { /* 読めなくても1曲目で動く */ }

      // 鳴らす瞬間にミュートを外し、曲ごとの音量を当てる
      function startTrack(i) {
        currentIndex = i;
        const a = tracks[i];
        a.muted = false;
        a.volume = TRACKS[i].vol;
        a.currentTime = 0;
        a.play().catch(() => {});
      }

      function play() {
        if (!enabled) return;
        isPlaying = true;
        startTrack(selectedIndex);
      }

      function pause() {
        if (!isPlaying) return;
        tracks[currentIndex].pause();
      }

      function resume() {
        if (!enabled || !isPlaying) return;
        tracks[currentIndex].muted = false;
        tracks[currentIndex].volume = TRACKS[currentIndex].vol;
        tracks[currentIndex].play().catch(() => {});
      }

      function stop() {
        isPlaying = false;
        tracks.forEach(t => { t.pause(); t.currentTime = 0; });
        currentIndex = selectedIndex;
      }

      function setEnabled(val) {
        enabled = val;
        if (!val) stop();
      }

      // 設定画面で曲を選ぶ。再生中に選び直したら、その場で切り替える
      function select(i) {
        if (i < 0 || i >= TRACKS.length) return;
        selectedIndex = i;
        try { localStorage.setItem(STORAGE_KEY, TRACKS[i].id); } catch (e) {}
        if (isPlaying) {
          tracks.forEach(t => { t.pause(); t.currentTime = 0; });
          startTrack(i);
        } else {
          currentIndex = i;
        }
      }

      // ユーザー操作中にBGMをミュート再生→即停止して解除しておく（ミュートは戻さない）
      function prime() {
        tracks.forEach(t => {
          t.muted = true;
          const p = t.play();
          if (p && p.then) {
            p.then(() => { t.pause(); t.currentTime = 0; }).catch(() => {});
          } else {
            try { t.pause(); t.currentTime = 0; } catch (e) {}
          }
        });
      }

      return {
        play, pause, resume, stop, setEnabled, prime, select,
        isEnabled: () => enabled,
        getTracks: () => TRACKS,
        getSelected: () => selectedIndex,
      };
    })();

    // ===== Fukidashi =====
    const fukidashiBubble = document.getElementById('fukidashiBubble');
    const fukidashiTextEl = document.getElementById('fukidashiText');
    let fukidashiTimer = null;

    // 文字幅を測るためだけの、画面に出ない要素
    const fukidashiRuler = document.createElement('span');
    fukidashiRuler.setAttribute('aria-hidden', 'true');
    fukidashiRuler.style.cssText =
      'position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;pointer-events:none;';
    document.body.appendChild(fukidashiRuler);

    function showFukidashi(text) {
      clearTimeout(fukidashiTimer);
      fukidashiBubble.classList.remove('show');
      fukidashiTextEl.textContent = text;

      // 「まだいける！諦めるな！」のような長い文言は、そのままだと吹き出しの絵から
      // 最後の文字がはみ出す。折り返すと絵の高さに収まらないので、入りきらないときだけ
      // 文字を小さくして収める。
      // 画面に出ている吹き出しは scale で拡大縮小されており getBoundingClientRect が
      // 当てにならないため、画面外に置いた計測用の要素で文字幅を測る。
      fukidashiBubble.style.fontSize = '';   // 前の文言で縮めた分を戻してから測る
      const bubbleStyle = getComputedStyle(fukidashiBubble);
      const textStyle = getComputedStyle(fukidashiTextEl);
      const available = parseFloat(bubbleStyle.maxWidth)
        - parseFloat(textStyle.paddingLeft) - parseFloat(textStyle.paddingRight);

      fukidashiRuler.style.fontFamily = textStyle.fontFamily;
      fukidashiRuler.style.fontWeight = textStyle.fontWeight;
      fukidashiRuler.style.letterSpacing = textStyle.letterSpacing;
      fukidashiRuler.textContent = text;

      let size = parseFloat(bubbleStyle.fontSize);
      if (isFinite(available) && available > 0) {
        for (let i = 0; i < 24 && size > 12; i++) {
          fukidashiRuler.style.fontSize = size + 'px';
          if (fukidashiRuler.offsetWidth <= available) break;
          size -= 1;
          fukidashiBubble.style.fontSize = size + 'px';
        }
      }

      void fukidashiBubble.offsetWidth;
      fukidashiBubble.classList.add('show');
      fukidashiTimer = setTimeout(() => {
        fukidashiBubble.classList.remove('show');
      }, 2600);
    }

    // ===== App =====
    const app = (() => {
      let roundTime = 180;
      let intervalTime = 60;
      let totalRoundsCount = 3;
      let currentRound = 0;
      let timeRemaining = 0;
      let phase = 'ready';
      let isRunning = false;
      let timerInterval = null;
      let soundEnabled = true;
      let cheerEnabled = false;

      let oneMinuteFired = false;
      let halfTimeFired = false;
      let lastMinuteFired = false;
      let countdownStarted = false;

      const cheerPhrases = [
        { text: 'いいよ！', file: 'cheer-iiyo.m4a' },
        { text: 'イケイケイケイケイケ！', file: 'cheer-ikeike.m4a' },
        { text: 'そこだー！もっと！', file: 'cheer-sokoda.m4a' },
        { text: 'その調子！', file: 'cheer-sonochoushi.m4a' },
        { text: 'ナイスー！', file: 'cheer-nice.m4a' },
        { text: 'まだいける！諦めるな！', file: 'cheer-madaikeru.m4a' },
        { text: '集中！', file: 'cheer-shuchu.m4a' },
        { text: '集中して！', file: 'cheer-shuchushite.m4a' },
      ];
      let nextCheerTime = 0;
      let lastCheerIndex = -1;

      function scheduleNextCheer() {
        nextCheerTime = Math.floor(Math.random() * 13) + 8;
      }

      function doCheer() {
        let idx;
        do {
          idx = Math.floor(Math.random() * cheerPhrases.length);
        } while (idx === lastCheerIndex && cheerPhrases.length > 1);
        lastCheerIndex = idx;
        const phrase = cheerPhrases[idx];
        VoiceManager.playCheer(phrase.file);
        showFukidashi(phrase.text);
        scheduleNextCheer();
      }

      const CIRCUMFERENCE = 2 * Math.PI * 124;

      const settingsScreen = document.getElementById('settingsScreen');
      const timerScreen = document.getElementById('timerScreen');
      const statusPill = document.getElementById('statusPill');
      const roundEl = document.getElementById('currentRound');
      const totalEl = document.getElementById('totalRounds');
      const digitsEl = document.getElementById('timerDigits');
      const progressEl = document.getElementById('ringProgress');
      const btnPause = document.getElementById('btnPause');
      const btnPauseImg = document.getElementById('btnPauseImg');

      function fmt(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return m + ':' + s;
      }

      const headerEl = document.getElementById('header');

      function showSettings() {
        settingsScreen.classList.remove('hidden');
        timerScreen.classList.remove('active');
        headerEl.classList.remove('header-small');
      }

      function showTimer() {
        settingsScreen.classList.add('hidden');
        timerScreen.classList.add('active');
        headerEl.classList.add('header-small');
      }

      function updateSettingsDisplay() {
        document.getElementById('roundTimeDisplay').textContent = fmt(roundTime);
        document.getElementById('intervalTimeDisplay').textContent = fmt(intervalTime);
        document.getElementById('roundsDisplay').textContent = totalRoundsCount;
      }

      function updateTimerDisplay() {
        digitsEl.textContent = fmt(timeRemaining);
        roundEl.textContent = currentRound;
        totalEl.textContent = totalRoundsCount;

        statusPill.textContent = phase === 'round' ? 'ROUND' : phase === 'interval' ? 'REST' : 'READY';
        statusPill.className = 'status-pill' + (phase === 'interval' ? ' interval' : '');

        const total = phase === 'round' ? roundTime : phase === 'interval' ? intervalTime : roundTime;
        const progress = total > 0 ? timeRemaining / total : 0;
        progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
        progressEl.className = 'ring-progress' + (phase === 'interval' ? ' interval' : '');

        if (phase === 'round' && timeRemaining <= 5 && timeRemaining > 0 && isRunning) {
          digitsEl.classList.add('warning');
        } else {
          digitsEl.classList.remove('warning');
        }

        // STOP/GO ボタン画像切り替え
        btnPauseImg.src = isRunning ? 'assets/stopbutton.png' : 'assets/go.png';
        btnPauseImg.alt = isRunning ? 'STOP' : 'GO';
      }

      function resetFlags() {
        oneMinuteFired = false;
        halfTimeFired = false;
        lastMinuteFired = false;
        countdownStarted = false;
        scheduleNextCheer();
      }

      // ラウンドコール用m4aファイル（1〜12）
      const roundVoiceFiles = {
        1: 'round01.m4a',
        2: 'round02.m4a',
        3: 'round03.m4a',
        4: 'round04.m4a',
        5: 'round05.m4a',
        6: 'round06.m4a',
        7: 'round07.m4a',
        8: 'round08.m4a',
        9: 'round09.m4a',
        10: 'round10.m4a',
        11: 'round11.m4a',
        12: 'round12.m4a',
      };

      function announceRound(num) {
        const file = roundVoiceFiles[num];
        if (file) {
          VoiceManager.play(file);
        }
      }

      function tick() {
        if (!isRunning) return;
        timeRemaining--;

        if (phase === 'round') {
          const elapsed = roundTime - timeRemaining;

          if (elapsed === 60 && !oneMinuteFired && roundTime > 90) {
            if (soundEnabled) VoiceManager.play('time-1min.m4a');
            showFukidashi('1分経過');
            oneMinuteFired = true;
          }

          const half = Math.floor(roundTime / 2);
          if (elapsed === half && !halfTimeFired && roundTime >= 60 && half !== 60) {
            if (soundEnabled) VoiceManager.play('time-half.m4a');
            showFukidashi('ハーフタイム');
            halfTimeFired = true;
          }

          if (timeRemaining === 60 && !lastMinuteFired && roundTime > 120 && timeRemaining !== half) {
            if (soundEnabled) VoiceManager.play('time-last1min.m4a');
            showFukidashi('ラスト1分');
            lastMinuteFired = true;
          }

          if (timeRemaining === 5 && !countdownStarted) {
            if (soundEnabled) VoiceManager.play('time-last5sec.m4a');
            showFukidashi('ラスト5秒');
            countdownStarted = true;
          }

          if (soundEnabled && timeRemaining <= 5 && timeRemaining > 0) {
            SoundManager.countdown();
          }

          if (cheerEnabled && timeRemaining > 6) {
            nextCheerTime--;
            if (nextCheerTime <= 0) {
              const justNotified = (elapsed === 60 && roundTime > 90)
                                || (elapsed === half && roundTime >= 60)
                                || (timeRemaining === 60 && roundTime > 120)
                                || (timeRemaining === 5);
              if (!justNotified) {
                doCheer();
              } else {
                scheduleNextCheer();
              }
            }
          }
        }

        if (timeRemaining <= 0) {
          if (phase === 'round') {
            if (soundEnabled) SoundManager.endGong();

            if (currentRound >= totalRoundsCount) {
              phase = 'finished';
              isRunning = false;
              clearInterval(timerInterval);
              timerInterval = null;
              if (soundEnabled) {
                setTimeout(() => VoiceManager.play('finish.m4a'), 1500);
              }
              setTimeout(() => showFukidashi('終了！お疲れ'), 1500);
              BGMManager.stop();
              document.getElementById('finishedOverlay').classList.add('show');
              track('workout_complete', { rounds: totalRoundsCount, ended_by: 'timer' });
              updateTimerDisplay();
              return;
            }

            phase = 'interval';
            timeRemaining = intervalTime;
            resetFlags();
            if (soundEnabled) {
              setTimeout(() => VoiceManager.play('interval.m4a'), 1000);
            }
            setTimeout(() => showFukidashi('インターバル'), 1000);
          } else if (phase === 'interval') {
            currentRound++;
            phase = 'round';
            timeRemaining = roundTime;
            resetFlags();
            if (soundEnabled) {
              SoundManager.gong();
              setTimeout(() => announceRound(currentRound), 800);
            }
            setTimeout(() => showFukidashi('ラウンド' + currentRound + 'ファイト'), 800);
          }
        }

        updateTimerDisplay();
      }

      function start() {
        currentRound = 1;
        phase = 'round';
        timeRemaining = roundTime;
        isRunning = true;
        resetFlags();
        showTimer();

        track('timer_start', {
          round_time: roundTime,
          interval_time: intervalTime,
          rounds: totalRoundsCount,
          sound: soundEnabled ? 'on' : 'off',
          cheer: cheerEnabled ? 'on' : 'off',
          bgm: document.getElementById('bgmToggle').checked ? 'on' : 'off',
          bgm_track: BGMManager.getTracks()[BGMManager.getSelected()].id
        });

        if (soundEnabled) {
          SoundManager.gong();
          setTimeout(() => announceRound(1), 800);
        }
        setTimeout(() => showFukidashi('ラウンド1ファイト'), 800);

        BGMManager.play();
        timerInterval = setInterval(tick, 1000);
        updateTimerDisplay();
      }

      function pause() {
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        BGMManager.pause();
        updateTimerDisplay();
      }

      function resume() {
        isRunning = true;
        BGMManager.resume();
        timerInterval = setInterval(tick, 1000);
        updateTimerDisplay();
      }

      function reset() {
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        BGMManager.stop();
        phase = 'ready';
        currentRound = 0;
        resetFlags();
        VoiceManager.stop();
        showSettings();
      }

      function skip() {
        if (phase === 'round') {
          if (currentRound >= totalRoundsCount) {
            phase = 'finished';
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            timeRemaining = 0;
            BGMManager.stop();
            document.getElementById('finishedOverlay').classList.add('show');
            track('workout_complete', { rounds: totalRoundsCount, ended_by: 'skip' });
            if (soundEnabled) SoundManager.endGong();
          } else {
            phase = 'interval';
            timeRemaining = intervalTime;
            resetFlags();
            if (soundEnabled) SoundManager.endGong();
          }
        } else if (phase === 'interval') {
          currentRound++;
          phase = 'round';
          timeRemaining = roundTime;
          resetFlags();
          if (soundEnabled) {
            SoundManager.gong();
            setTimeout(() => announceRound(currentRound), 600);
          }
        }
        updateTimerDisplay();
      }

        bgmPickerEl.classList.toggle('show', bgmToggleEl.checked);
        if (!scrollIntoView || !bgmToggleEl.checked) return;

        // 縦が狭い端末だと開いた先が隠れるので、見える位置まで送る。
        // 開ききる前に送ると途中の高さを基準にしてしまい中途半端な位置で止まるため、
        // アニメーションの完了を待ってから動かす。ピッカーは一番下の要素なので末尾まで送れば全部見える。
        const scroller = bgmPickerEl.parentElement;
        let moved = false;
        const go = () => {
          if (moved) return;
          moved = true;
          bgmPickerEl.removeEventListener('transitionend', go);
          try {
            scroller.scrollTo({ top: scroller.scrollHeight, behavior: 'smooth' });
          } catch (e) {
            scroller.scrollTop = scroller.scrollHeight;
          }
        };
        bgmPickerEl.addEventListener('transitionend', go);
        setTimeout(go, 500);   // transitionend が来なかったときの保険

        const set = currentSet();
        tableEl.innerHTML = '';
        set.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'wt-row';
          row.dataset.index = i;

          const name = document.createElement('span');
          name.textContent = c.jp;

          const limit = document.createElement('span');
          limit.className = 'wt-limit';
          if (style === 'pro') {
            limit.textContent = (c.kg === null) ? '無差別' : kg(c.kg) + ' kg / ' + c.lb + ' lb';
          } else {
            limit.textContent = (c.kg === null)
              ? '+' + fmtLimit(c.floor) + ' kg'
              : fmtRange(c) + ' kg';
          }

          row.appendChild(name);
          row.appendChild(limit);
          tableEl.appendChild(row);
        });
      }

      function render() {
        const set = currentSet();
        const heaviest = set[set.length - 1];
        // アマ女子・ジュニアの最重量階級には上限があるため、超えると該当階級が無い
        const overTop = heaviest.kg !== null && weight > heaviest.kg;
        const idx = findIndex(weight);
        const cls = set[idx];
        const lower = idx > 0 ? set[idx - 1] : null;

        if (overTop) {
          wrName.textContent = '該当階級なし';
          wrEn.textContent = 'OVER THE TOP CLASS';
          wrMeta.innerHTML =
            '最重量の' + heaviest.jp + '（上限 ' + fmtLimit(heaviest.kg) + ' kg）を<br>' +
            '<b>' + kg(weight - heaviest.kg) + '</b> kg 超えています';
          tableEl.querySelectorAll('.wt-row').forEach((row) => row.classList.remove('current'));
          return;
        }

        wrName.textContent = cls.jp;
        wrEn.textContent = cls.en;

        const lines = [];
        if (cls.kg === null) {
          lines.push(style === 'pro'
            ? 'リミット <b>なし</b>（無差別）'
            : '<b>' + fmtLimit(cls.floor) + '</b> kg 超（上限なし）');
        } else if (style === 'pro') {
          lines.push('リミット <b>' + kg(cls.kg) + '</b> kg ／ ' + cls.lb + ' lb');
        } else {
          lines.push('階級 <b>' + fmtRange(cls) + '</b> kg');
        }

        // アマの最軽量階級は下限を下回ると出場できない
        const underFloor = !lower && cls.floor !== null && weight < cls.floor;

        if (cls.kg !== null && !underFloor) {
          const margin = cls.kg - weight;
          lines.push(margin < 0.005
            ? 'ちょうど <b>リミット</b>'
            : 'リミットまで 余裕 <b>' + kg(margin) + '</b> kg');
        }

        if (underFloor) {
          lines.push('下限 ' + fmtLimit(cls.floor) + ' kg まで あと <b>' + kg(cls.floor - weight) + '</b> kg 必要');
        } else if (lower) {
          lines.push(lower.jp + 'なら あと <b>' + kg(weight - lower.kg) + '</b> kg 減量');
        }
        wrMeta.innerHTML = lines.join('<br>');

        tableEl.querySelectorAll('.wt-row').forEach((row) => {
          row.classList.toggle('current', Number(row.dataset.index) === idx);
        });

        // 該当行が隠れていたら見える位置へ
        const currentRow = tableEl.querySelector('.wt-row.current');
        if (currentRow && weightScreen.classList.contains('active')) {
          const wrap = tableEl.parentElement;
          const top = currentRow.offsetTop;
          const bottom = top + currentRow.offsetHeight;
          if (top < wrap.scrollTop || bottom > wrap.scrollTop + wrap.clientHeight) {
            wrap.scrollTop = top - (wrap.clientHeight - currentRow.offsetHeight) / 2;
          }
        }
      }

      function renderNote() {
        const src = SRC[style];
        noteEl.innerHTML =
          src.note + '<br>' +
          '出典: <a href="' + src.url + '" target="_blank" rel="noopener">' + src.label + '</a><br>' +
          'データ更新日 ' + DATA_UPDATED;
      }

      function refresh() {
        buildTable();
        renderNote();
        render();
      }

      const clamp = (w) => Math.min(MAX_W, Math.max(MIN_W, w));

      function setWeight(w, syncInput) {
        weight = Math.round(clamp(w) * 100) / 100;
        if (syncInput) input.value = fmtW(weight);
        store(STORAGE_KEY, String(weight));
        render();
      }

      function buildSubSeg() {
        const seg = document.getElementById('segSub');
        seg.innerHTML = '';
        seg.style.flex = String(SUBS[style].length);
        SUBS[style].forEach(([val, label]) => {
          const b = document.createElement('button');
          b.className = 'wc-seg-btn' + (val === sub ? ' active' : '');
          b.textContent = label;
          b.addEventListener('click', () => {
            setMode(style, val);
            track('weight_class_mode', { mode: style + '_' + sub });
          });
          seg.appendChild(b);
        });
      }

      // 区分ごとに最後に選んだ下位区分を覚えておき、戻ってきたときに復元する
      const lastSub = { pro: 'm', am: 'm', uj: 'e', jcl: 'u12' };

      function setMode(nextStyle, nextSub) {
        style = nextStyle;
        const valid = SUBS[style].map((x) => x[0]);
        sub = valid.indexOf(nextSub) === -1 ? lastSub[style] : nextSub;
        lastSub[style] = sub;
        store(MODE_KEY, style + '_' + sub);
        document.querySelectorAll('#segStyle .wc-seg-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.style === style);
        });
        buildSubSeg();
        refresh();
      }

      function openWeight() {
        track('weight_class_open', { mode: style + '_' + sub });
        settingsScreen.classList.add('hidden');
        weightScreen.classList.add('active');
        input.value = fmtW(weight);
        render();
      }

      function closeWeight() {
        weightScreen.classList.remove('active');
        settingsScreen.classList.remove('hidden');
      }

      // 入力中は数値だけ拾う（確定はblur時に整形）
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        if (!isNaN(v) && v >= MIN_W && v <= MAX_W) setWeight(v, false);
      });

      input.addEventListener('blur', () => { setWeight(parseFloat(input.value) || weight, true); });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
      input.addEventListener('focus', () => { input.select(); });

      // iOSの数字キーボードには完了キーが無いため、入力欄以外をタップしたら閉じる
      weightScreen.addEventListener('click', (e) => {
        if (e.target !== input) input.blur();
      });

      document.getElementById('btnWeight').addEventListener('click', openWeight);
      document.getElementById('btnWeightBack').addEventListener('click', closeWeight);

      document.querySelectorAll('#segStyle .wc-seg-btn').forEach((b) => {
        b.addEventListener('click', () => {
          setMode(b.dataset.style, sub);
          track('weight_class_mode', { mode: style + '_' + sub });
        });
      });

      // 保存値の復元
      let stored = null, storedMode = null;
      try {
        stored = localStorage.getItem(STORAGE_KEY);
        storedMode = localStorage.getItem(MODE_KEY);
      } catch (e) { /* プライベートブラウズ等 */ }
      if (stored !== null && !isNaN(parseFloat(stored))) weight = clamp(parseFloat(stored));
      if (storedMode && SETS[storedMode]) {
        const parts = storedMode.split('_');
        style = parts[0];
        sub = parts[1];
        lastSub[style] = sub;
      }

      input.value = fmtW(weight);
      setMode(style, sub);
    })();

    // ===== Intro Animation (Splash → Settings) =====
    (() => {
      const splashScreen = document.getElementById('splashScreen');
      const splashLogo = splashScreen.querySelector('.splash-logo');
      const splashIllust = splashScreen.querySelector('.splash-illust');

      const headerLogo = document.querySelector('.header .logo-image');
      const cards = document.querySelectorAll('.settings-cards > *');
      const startArea = document.querySelector('.start-area');

      // Step 1: タイトルロゴ フェードイン (0.3s後)
      setTimeout(() => {
        splashLogo.classList.add('fade-in');
      }, 300);

      // Step 2: illust.png フェードイン (1.0s後)
      setTimeout(() => {
        splashIllust.classList.add('fade-in');
      }, 1000);

      // Step 3: 少し見せてから、ディゾルブ開始 (3.0s後)
      setTimeout(() => {
        splashScreen.classList.add('dissolve');
      }, 3000);

      // Step 4: ディゾルブ中に設定画面のイントロアニメ開始
      const settingsStart = 3400;

      // ヘッダーロゴ フェードイン
      setTimeout(() => {
        headerLogo.classList.add('anim-in');
      }, settingsStart);

      // 設定カード: 上から順にチルトイン
      cards.forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('anim-in');
        }, settingsStart + 300 + i * 100);
      });

      // STARTボタン: 最後にフェードイン
      const startDelay = settingsStart + 300 + cards.length * 100 + 100;
      setTimeout(() => {
        startArea.classList.add('anim-in');
      }, startDelay);

      // Step 5: スプラッシュ完全に非表示 & introクラス削除
      setTimeout(() => {
        splashScreen.classList.add('hidden');
      }, 4500);

      setTimeout(() => {
        document.body.classList.remove('intro');
      }, startDelay + 600);
    })();

    // ===== ホーム画面への追加方法 =====
    (() => {
      const ua = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/.test(ua) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/.test(ua);

      // SNSのアプリ内ブラウザからは「ホーム画面に追加」ができない。
      // ここを案内しないと「追加できない」という詰まり方をする。
      const inAppName =
        /Line\//i.test(ua) ? 'LINE' :
        /Instagram/i.test(ua) ? 'Instagram' :
        /FBAN|FBAV|FB_IAB/i.test(ua) ? 'Facebook' :
        /Twitter/i.test(ua) ? 'X（Twitter）' :
        /TikTok|BytedanceWebview/i.test(ua) ? 'TikTok' : null;

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                           navigator.standalone === true;

      // Androidは条件を満たすとブラウザ側がインストールを提案できる。その権利を預かっておく。
      let installPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        installPrompt = e;
        if (currentOs === 'android') render();
      });

      const overlay = document.getElementById('installHelp');
      const body = document.getElementById('installBody');
      const seg = document.getElementById('installSeg');
      let currentOs = isAndroid ? 'android' : 'ios';

      const SHARE_ICON =
        '<svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 15V3"></path><path d="M8 7l4-4 4 4"></path>' +
        '<path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>';

      const el = (tag, cls, html) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html != null) n.innerHTML = html;
        return n;
      };

      function note(cls, title, text) {
        const n = el('div', 'install-note' + (cls ? ' ' + cls : ''));
        n.append(el('div', 'install-note-title', title));
        n.append(el('div', null, text));
        return n;
      }

      function steps(items) {
        const ol = el('ol', 'install-steps');
        items.forEach(t => ol.append(el('li', null, t)));
        return ol;
      }

      // URLをコピーできれば、どのアプリ内ブラウザからでも脱出できる
      function copyUrlButton() {
        const b = el('button', 'install-btn sub', 'URLをコピー');
        b.addEventListener('click', async (e) => {
          e.stopPropagation();
          const url = location.href.split('?')[0];
          try {
            await navigator.clipboard.writeText(url);
            b.textContent = 'コピーしました';
          } catch (err) {
            // clipboardが使えない環境向けの保険
            const ta = document.createElement('textarea');
            ta.value = url;
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); b.textContent = 'コピーしました'; }
            catch (e2) { b.textContent = 'コピーできませんでした'; }
            document.body.removeChild(ta);
          }
          setTimeout(() => { b.textContent = 'URLをコピー'; }, 2000);
        });
        return b;
      }

      function render() {
        body.innerHTML = '';
        seg.querySelectorAll('.wc-seg-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.os === currentOs);
        });

        if (isStandalone) {
          body.append(note('done', '追加済みです',
            'すでにホーム画面のアイコンから起動しています。この画面を閉じてそのままお使いください。'));
          return;
        }

        if (inAppName) {
          const browser = currentOs === 'ios' ? 'Safari' : 'Chrome';
          const n = note(null, inAppName + 'の中では追加できません',
            inAppName + 'のブラウザには「ホーム画面に追加」がありません。' +
            '先に' + browser + 'で開き直してください。' + inAppName +
            'の画面右下などにある「…」から「' + browser + 'で開く」を選ぶか、下のボタンでURLをコピーして' +
            browser + 'に貼り付けてください。');
          const actions = el('div', 'install-actions');
          if (/Line\//i.test(ua)) {
            // LINEは外部ブラウザで開き直させる仕組みが用意されている
            const b = el('button', 'install-btn', browser + 'で開く');
            b.addEventListener('click', (e) => {
              e.stopPropagation();
              const base = location.href.split('?')[0].split('#')[0];
              location.href = base + '?openExternalBrowser=1';
            });
            actions.append(b);
          }
          actions.append(copyUrlButton());
          n.append(actions);
          body.append(n);
        }

        if (currentOs === 'ios') {
          body.append(steps([
            'Safari でこのページを開きます。',
            '画面の下にある共有ボタン' + SHARE_ICON + 'をタップします。',
            'メニューを下にスクロールして「ホーム画面に追加」をタップします。',
            '右上の「追加」をタップすると完了です。'
          ]));
          if (!isIOS && !inAppName) {
            body.append(note(null, '補足',
              'いまお使いの端末は iPhone ではないようです。手順はご自身の端末に合わせてご覧ください。'));
          }
        } else {
          body.append(steps([
            'Chrome でこのページを開きます。',
            '画面右上の「︙」をタップします。',
            '「ホーム画面に追加」または「アプリをインストール」をタップします。',
            '確認画面で「追加」「インストール」をタップすると完了です。'
          ]));
          if (installPrompt) {
            const actions = el('div', 'install-actions');
            const b = el('button', 'install-btn', 'このままインストール');
            b.addEventListener('click', async (e) => {
              e.stopPropagation();
              const p = installPrompt;
              installPrompt = null;
              b.disabled = true;
              try {
                p.prompt();
                const res = await p.userChoice;
                track('install_prompt_result', { outcome: res && res.outcome });
              } catch (err) { /* 失敗しても手順の案内は残る */ }
              render();
            });
            actions.append(b);
            const wrap = el('div');
            wrap.append(actions);
            body.append(wrap);
          }
        }
      }

      function open() {
        currentOs = isAndroid ? 'android' : 'ios';
        render();
        overlay.classList.add('show');
        track('install_help_open', {
          os: isAndroid ? 'android' : (isIOS ? 'ios' : 'other'),
          in_app: inAppName || 'none',
          standalone: isStandalone ? 'yes' : 'no'
        });
      }

      function close() { overlay.classList.remove('show'); }

      document.getElementById('btnInstallHelp').addEventListener('click', open);
      document.getElementById('installHelpClose').addEventListener('click', close);
      // 背景をタップしたら閉じる（カードの中のタップでは閉じない）
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      seg.addEventListener('click', (e) => {
        const b = e.target.closest('.wc-seg-btn');
        if (!b) return;
        currentOs = b.dataset.os;
        render();
        track('install_help_tab', { os: currentOs });
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('show')) close();
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
