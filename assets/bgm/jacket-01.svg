<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="8 COUNT">
  <!-- 8 COUNT ─ レフェリーのカウントダイヤル -->
  <rect width="400" height="400" fill="#17161a"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#f0ece8" stroke-opacity=".14"/>
  <circle cx="200" cy="200" r="118" fill="none" stroke="#f0ece8" stroke-opacity=".16" stroke-width="2"/>
  <g stroke="#f0ece8" stroke-opacity=".85" stroke-width="10" stroke-linecap="square">
    <line x1="200" y1="74"    x2="200"   y2="48"/>
    <line x1="289.1" y1="110.9" x2="307.5" y2="92.5"/>
    <line x1="326" y1="200"   x2="352"   y2="200"/>
